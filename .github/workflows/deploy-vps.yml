# Primary deploy: build images on the VPS (docker compose build), then up + migrate.
# VPS .env: APT_MIRROR / NPM_REGISTRY for China mirrors; leave empty for SEA.
# GHCR backup (build on GitHub, pull on VPS): deploy-vps.ghcr.backup.yml
# Secrets: VPS_HOST, SSH_USER, SSH_PRIVATE_KEY
# Path: ~/property-management-system · branch: release

name: Deploy to VPS

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd ~/property-management-system
            git fetch origin
            git checkout release
            git reset --hard origin/release

            for img in cabin-api cabin-pms; do
              if docker image inspect "${img}:latest" >/dev/null 2>&1; then
                docker tag "${img}:latest" "${img}:previous"
              fi
            done

            docker compose build api
            docker compose build pms
            docker compose up -d
            docker compose exec -T api pnpm run prisma:migrate:deploy

            for img in cabin-api cabin-pms; do
              docker images --format '{{.Repository}}:{{.Tag}}' "$img" | while read -r ref; do
                case "$ref" in
                  *:latest|*:previous) ;;
                  *) docker rmi "$ref" || true ;;
                esac
              done
            done
            docker image prune -f
            docker container prune -f
            docker builder prune -f --keep-storage 2GB
