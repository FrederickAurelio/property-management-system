# Primary deploy: build on GitHub → push GHCR → VPS pulls (no apt/npm build on VPS).
# Build args APT_MIRROR / NPM_REGISTRY stay empty here (official registries on GH runners).
# VPS .env mirrors are unused for this path; keep them for emergency direct rebuild.
# Direct-on-VPS backup: deploy-vps.direct.backup.yml
# Secrets: VPS_HOST, SSH_USER, SSH_PRIVATE_KEY
# Path: ~/property-management-system · branch: release
# Images: ghcr.io/<owner>/cabin-api , cabin-pms , cabin-web

name: Deploy to VPS

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote cabin-api latest → previous
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-api"
          if docker pull "${IMG}:latest"; then
            docker tag "${IMG}:latest" "${IMG}:previous"
            docker push "${IMG}:previous"
          fi

      - name: Promote cabin-pms latest → previous
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-pms"
          if docker pull "${IMG}:latest"; then
            docker tag "${IMG}:latest" "${IMG}:previous"
            docker push "${IMG}:previous"
          fi

      - name: Promote cabin-web latest → previous
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-web"
          if docker pull "${IMG}:latest"; then
            docker tag "${IMG}:latest" "${IMG}:previous"
            docker push "${IMG}:previous"
          fi

      - name: Build and push cabin-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Avoid attestation digests that break GHCR when untagged versions are pruned
          provenance: false
          sbom: false
          # Official registries on GitHub runners — do not pass China mirrors
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-api:latest
          cache-from: type=gha,scope=cabin-api
          cache-to: type=gha,mode=max,scope=cabin-api

      - name: Build and push cabin-pms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pms/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-pms:latest
          cache-from: type=gha,scope=cabin-pms
          cache-to: type=gha,mode=max,scope=cabin-pms

      - name: Build and push cabin-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APT_MIRROR=
            NPM_REGISTRY=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cabin-web:latest
          cache-from: type=gha,scope=cabin-web
          cache-to: type=gha,mode=max,scope=cabin-web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 6h
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/property-management-system
            # Stale locks from crashed/interrupted git (common after VPS hard reboot)
            find .git -type f -name '*.lock' -delete 2>/dev/null || true
            git fetch origin
            git checkout release
            git reset --hard origin/release

            OWNER="${{ steps.meta.outputs.owner }}"
            API="ghcr.io/${OWNER}/cabin-api"
            PMS="ghcr.io/${OWNER}/cabin-pms"
            WEB="ghcr.io/${OWNER}/cabin-web"

            if docker inspect cabin-api >/dev/null 2>&1; then
              docker tag "$(docker inspect -f '{{.Image}}' cabin-api)" "${API}:previous" || true
            fi
            if docker inspect cabin-pms >/dev/null 2>&1; then
              docker tag "$(docker inspect -f '{{.Image}}' cabin-pms)" "${PMS}:previous" || true
            fi
            if docker inspect cabin-web >/dev/null 2>&1; then
              docker tag "$(docker inspect -f '{{.Image}}' cabin-web)" "${WEB}:previous" || true
            fi

            # Private GHCR: one-time `docker login ghcr.io` on the VPS (PAT with read:packages)
            export DOCKER_CLIENT_TIMEOUT=3600
            export COMPOSE_HTTP_TIMEOUT=3600
            export IMAGE_API="${API}:latest"
            export IMAGE_PMS="${PMS}:latest"
            export IMAGE_WEB="${WEB}:latest"

            # shellcheck source=deploy/lib/compose.sh
            source deploy/lib/compose.sh
            compose_bootstrap_if_missing

            # Mainland China routes to GHCR can reset long layer downloads.
            # Docker keeps completed layers, so retries resume remaining work.
            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.yml -f docker-compose.ci.yml pull; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "GHCR pull failed after 5 attempts"
                exit 1
              fi
              delay=$((attempt * 30))
              echo "GHCR pull attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            done

            docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --remove-orphans
            COMPOSE_FILE_ARGS="-f docker-compose.yml -f docker-compose.ci.yml" bash ./deploy/vps-migrate-deploy.sh
            # Idempotent bootstrap (SUPER_ADMIN + demo inventory if missing)
            docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api node dist/scripts/seed.js

            # Avoid `case … ;;` — appleboy/ssh-action can mangle `;;` into a bash syntax error.
            for img in "${API}" "${PMS}" "${WEB}"; do
              docker images --format '{{.Repository}}:{{.Tag}}' | while read -r ref; do
                if [ "$ref" = "${img}:latest" ] || [ "$ref" = "${img}:previous" ]; then
                  continue
                fi
                prefix="${img}:"
                if [ "${ref#"$prefix"}" != "$ref" ]; then
                  docker rmi "$ref" || true
                fi
              done
            done
            docker image prune -f
            docker container prune -f
            # no builder prune — images are pulled, not built on VPS
