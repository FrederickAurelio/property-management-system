  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cabin_pms}?schema=public
  #   ports:
  #     - '${API_PORT:-3000}:3000'
  #   networks:
  #     - cabin
  #
  # pms:
  #   build: ./apps/pms
  #   container_name: cabin-pms
  #   depends_on:
  #     - api
  #   ports:
  #     - '${PMS_PORT:-5173}:5173'
  #   networks:
  #     - cabin
  #
  # web:
  #   build: ./apps/web
  #   container_name: cabin-web
  #   depends_on:
