# VPS / full stack — postgres + api + pms + web on cabin-net.
# Host ports: pms 8080→80 · web 3050→80. api and postgres stay internal.
# Local Postgres: use docker-compose.dev.yml via `pnpm db:up`.
# GHCR deploy: also use docker-compose.ci.yml with IMAGE_API / IMAGE_PMS / IMAGE_WEB.

name: cabin

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cabin_pms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks:
      - cabin

  api:
    image: cabin-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Empty on GHCR / SEA. China direct rebuild: set in .env
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: cabin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cabin_pms}?schema=public
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks:
      - cabin

  pms:
    image: cabin-pms:latest
    build:
      context: .
      dockerfile: apps/pms/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: cabin-pms
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'
    logging: *default-logging
    networks:
      - cabin

  web:
    image: cabin-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: cabin-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3050:80'
    logging: *default-logging
    networks:
      - cabin

volumes:
  postgres_data:
    name: cabin-postgres-data

networks:
  cabin:
    name: cabin-net
