# VPS / full stack — postgres + api + pms on cabin-net.
# Only pms publishes a host port (8080→80). api and postgres stay internal.
# Local Postgres: use docker-compose.dev.yml via `pnpm db:up`.

name: cabin

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cabin_pms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cabin

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cabin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cabin_pms}?schema=public
    expose:
      - '3000'
    networks:
      - cabin

  pms:
    build:
      context: .
      dockerfile: apps/pms/Dockerfile
    container_name: cabin-pms
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'
    networks:
      - cabin

volumes:
  postgres_data:
    name: cabin-postgres-data

networks:
  cabin:
    name: cabin-net
