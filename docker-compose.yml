# Cabin PMS — local / future full-stack Docker
# Now: Postgres only (host port for Nest + Prisma on the host).
# Later: uncomment / add api, pms, web on the same network.

name: cabin

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabin-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cabin_pms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cabin

  # --- future (host apps talk to postgres via localhost for now) ---
