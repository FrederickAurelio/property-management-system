# Path-style public reads for Garage website endpoint.
# Browser hits http://127.0.0.1:3910/{key}; nginx rewrites Host to the bucket name
# so Garage serves the object (see Garage "Exposing buckets as websites").

server {
  listen 80;
  server_name _;
  client_max_body_size 32m;

  location / {
    proxy_pass http://garage:3902;
    proxy_http_version 1.1;
    proxy_set_header Host cabin-archive;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
