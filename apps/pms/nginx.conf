server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same contract as Vite: browser `/api/...` → Nest `/staff/...`
  # (strip /api, inject /staff).
  location /api/ {
    proxy_pass http://api:3000/staff/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /api {
    return 301 /api/;
  }

  # Phase 1 iCal export for OTAs — public, no session. Keeps Nest off the host network.
  location /public/ical/ {
    proxy_pass http://api:3000/public/ical/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
